# Gallery items, shown in this order (masonry grid).
#
# Photos:
#   - type: photo
#     image: /assets/images/gallery/filename.jpg
#     title: "..."
#     caption: "..."
#
# Videos — set youtube_id once it's uploaded to YouTube (preferred: no big
# .mp4 files to serve); until then, video_src plays the local file instead.
#   - type: video
#     youtube_id: "dQw4w9WgXcQ"   # from youtube.com/watch?v=THIS_PART
#     video_src: /assets/videos/filename.mp4   # fallback / current source
#     thumb: /assets/images/gallery/optional-poster.jpg  # optional poster frame
#     title: "..."
#     caption: "..."
