name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The payload (≈780 MB) is generated by scripts/prepare_data.py and is NOT
      # committed (public/data is git-ignored). Either
      #   (a) publish it somewhere and hand it to the build here — set the
      #       repository variable PAYLOAD_URL to a .tar.gz of public/data, or
      #   (b) keep the site app-only and point the browser at a data host with
      #       data/base-url.txt / ?dataBaseUrl=… — see README,
      #       “Serving the payload”.
      - name: Restore payload (optional)
        run: |
          if [ -n "${{ vars.PAYLOAD_URL }}" ]; then
            mkdir -p public/data
            curl -sSL "${{ vars.PAYLOAD_URL }}" | tar -xz -C public/data
          else
            echo "::notice::no PAYLOAD_URL — deploying the app without data (it will show the data-source dialog)"
          fi

      - name: Type-check and build
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
