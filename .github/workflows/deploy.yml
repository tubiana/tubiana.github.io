name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Data is NOT committed (public/data is git-ignored) — code here, data on
      # Hugging Face / institute storage. Either
      #   (a) set the repository variable DATA_BASE_URL to the data root, e.g.
      #       https://huggingface.co/datasets/ttubiana/HEV-ORF1-models/resolve/main
      #       → the app stays ~1 MB and streams from there (see REPORT-hf-upload.md), or
      #   (b) set PAYLOAD_URL to a .tar.gz of public/data to ship the payload inside
      #       dist/data/, or
      #   (c) leave both empty and let visitors set ?dataBaseUrl=… / the ⚙ dialog.
      - name: Restore payload (optional)
        run: |
          if [ -n "${{ vars.PAYLOAD_URL }}" ]; then
            mkdir -p public/data
            curl -sSL "${{ vars.PAYLOAD_URL }}" | tar -xz -C public/data
          else
            echo "::notice::no PAYLOAD_URL — deploying the app without data (it will show the data-source dialog)"
          fi

      - name: Type-check and build
        env:
          # empty when the variable is unset → the app falls back to ./data and
          # to ?dataBaseUrl= / the ⚙ dialog
          VITE_DATA_BASE_URL: ${{ vars.DATA_BASE_URL }}
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
