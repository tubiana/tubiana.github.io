<!DOCTYPE html>
<html lang="{{ site.lang }}">
<head>
  {% include head.html %}
</head>
<body>
  {% include nav.html %}
  {{ content }}
  {% include footer.html %}
  <script src="{{ '/assets/js/nav.js' | relative_url }}" defer></script>
  <script src="{{ '/assets/js/reveal.js' | relative_url }}" defer></script>
  <script src="{{ '/assets/js/email-obfuscate.js' | relative_url }}" defer></script>
  {% if page.extra_js %}
    {% for src in page.extra_js %}
      <script src="{{ src | relative_url }}" defer></script>
    {% endfor %}
  {% endif %}
</body>
</html>
